<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>75 Hard Tracker</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a2e;
            --surface2: #16213e;
            --accent: #e94560;
            --accent2: #0f3460;
            --text: #eaeaea;
            --text-muted: #8892b0;
            --success: #4ecdc4;
            --border: #2a2a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 2rem 0;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--surface2);
            border-radius: 6px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin: 1rem 0;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:hover {
            background: var(--surface2);
            border-radius: 8px;
        }

        .task-icon {
            font-size: 1.5rem;
            margin-right: 1rem;
            width: 40px;
            text-align: center;
        }

        .task-info {
            flex: 1;
        }

        .task-name {
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .task-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .task-toggle {
            background: none;
            border: 2px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .task-toggle.done {
            background: var(--success);
            border-color: var(--success);
        }

        .task-toggle.done::after {
            content: "✓";
            color: var(--bg);
            font-weight: 700;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            width: 100%;
        }

        .btn-secondary {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--text);
            background: var(--surface);
        }

        .day-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .day-badge.complete {
            background: var(--success);
            color: var(--bg);
        }

        .day-badge.incomplete {
            background: var(--surface2);
            color: var(--text-muted);
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .start-screen {
            text-align: center;
            padding: 3rem 1rem;
        }

        .start-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .start-screen p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .rules-list {
            text-align: left;
            list-style: none;
            margin-bottom: 2rem;
        }

        .rules-list li {
            padding: 0.5rem 0;
            padding-left: 1.5rem;
            position: relative;
            color: var(--text-muted);
        }

        .rules-list li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--accent);
        }

        .footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ===== WIKINGER / SCHLACHTFELD STYLES ===== */

        .viking-card {
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 1px solid #3a2a1a;
            position: relative;
        }

        .viking-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #8b6914, #c9a227, #8b6914, transparent);
        }

        .viking-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #c9a227;
            text-align: center;
            margin-bottom: 0.25rem;
            letter-spacing: 1px;
        }

        .viking-subtitle {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.8rem;
        }

        .skull-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .skull-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .skulls {
            display: flex;
            gap: 1rem;
            font-size: 2rem;
        }

        .skull {
            opacity: 0.3;
            transition: all 0.3s;
        }

        .skull.active {
            opacity: 1;
            filter: drop-shadow(0 0 8px #e94560);
        }

        .skull-warning {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
        }

        .battlefield-grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            gap: 4px;
            margin-top: 1.5rem;
        }

        @media (max-width: 500px) {
            .battlefield-grid {
                grid-template-columns: repeat(10, 1fr);
            }
        }

        .day-rune {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            border-radius: 6px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            cursor: default;
            transition: all 0.2s;
            position: relative;
        }

        .day-rune.done {
            background: #0a2a2a;
            border-color: #4ecdc4;
            box-shadow: 0 0 4px rgba(78, 205, 196, 0.3);
        }

        .day-rune.fail {
            background: #2a0a0a;
            border-color: #e94560;
            box-shadow: 0 0 6px rgba(233, 69, 96, 0.4);
        }

        .day-rune.today {
            background: #2a2a0a;
            border-color: #f0c040;
            box-shadow: 0 0 8px rgba(240, 192, 64, 0.4);
            animation: pulse-today 2s infinite;
        }

        .day-rune.partial {
            background: #1a1a2a;
            border-color: #5a5a8a;
        }

        .day-rune.missed {
            background: #151515;
            border-color: #333;
        }

        .day-rune.future {
            background: #0d0d0d;
            border-color: #1a1a1a;
            opacity: 0.4;
        }

        @keyframes pulse-today {
            0%, 100% { box-shadow: 0 0 8px rgba(240, 192, 64, 0.4); }
            50% { box-shadow: 0 0 16px rgba(240, 192, 64, 0.7); }
        }

        .rune-mark {
            font-size: 1rem;
            line-height: 1;
        }

        .day-rune.done .rune-mark { color: #4ecdc4; }
        .day-rune.fail .rune-mark { color: #e94560; }
        .day-rune.today .rune-mark { color: #f0c040; }
        .day-rune.partial .rune-mark { color: #8892b0; }
        .day-rune.missed .rune-mark { color: #555; }
        .day-rune.future .rune-mark { color: #333; }

        .day-num {
            font-size: 0.55rem;
            color: var(--text-muted);
            opacity: 0.6;
            margin-top: 1px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-fail {
            background: linear-gradient(135deg, #8b0000, #e94560);
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-fail:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>75 HARD</h1>
            <p>Der Krieg gegen dich selbst</p>
        </header>

        {% block content %}{% endblock %}

        <div class="footer">
            75 Hard Tracker &middot; Bleib diszipliniert.
        </div>
    </div>
</body>
</html>
