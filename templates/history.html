{% extends "base.html" %}

{% block content %}
<nav>
    <a href="/">Heute</a>
    <a href="/schlachtfeld">⚔️ Schlachtfeld</a>
    <a href="/timer">⏱️ Timer</a>
    <a href="/history" class="active">Verlauf</a>
</nav>

<div class="card">
    <h3 style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">
        Tagesverlauf
    </h3>

    {% if days_list %}
        {% for day in days_list %}
        <div class="history-item">
            <div>
                <strong>Tag {{ day.day_number }}</strong>
                <span style="color: var(--text-muted); font-size: 0.8rem; margin-left: 0.5rem;">{{ day.date }}</span>
            </div>
            <div>
                <span class="day-badge {{ 'complete' if day.complete else 'incomplete' }}">
                    {{ day.tasks_done }}/6
                </span>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <p style="color: var(--text-muted); text-align: center; padding: 2rem;">
            Noch keine Einträge vorhanden.
        </p>
    {% endif %}
</div>
{% endblock %}
